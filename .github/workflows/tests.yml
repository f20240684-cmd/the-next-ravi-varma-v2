name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU build of the pinned torch first, so requirements.txt does not pull ~2 GB of CUDA wheels.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint (pyflakes)
        run: python -m pyflakes src scripts app tests

      # The training and tokenizer tests skip themselves when their models are not cached (so the
      # suite also runs offline); fetch the small public files so CI really runs them.
      - name: Fetch small test models
        run: |
          python -c "from huggingface_hub import snapshot_download as d; d('hf-internal-testing/tiny-stable-diffusion-pipe'); d('stable-diffusion-v1-5/stable-diffusion-v1-5', allow_patterns=['tokenizer/*'])"

      # Includes a real LoRA training run on the 1 MB tiny SD model (CPU) and the CLIP evaluation
      # tests. --rs prints the reason for every skip, so a silently skipped test is visible.
      - name: Tests
        run: python -m pytest -q -p no:warnings -rs
