  Shakuntala:   {aliases: [shakuntala, sakuntala, sakunthala], look: "Shakuntala, young woman in simple forest attire"}
  Dushyanta:    {aliases: [dushyanta, dushyant], look: "King Dushyanta with crown and bow"}
  Damayanti:    {aliases: [damayanti, damayanthi], look: "Damayanti, princess in a sari with a white swan"}
  Nala:         {aliases: [nala], look: "King Nala"}
  Menaka:       {aliases: [menaka], look: "Menaka, celestial apsara with flowing veils"}
  Vishwamitra:  {aliases: [vishwamitra, vishvamitra], look: "Vishwamitra, bearded sage with matted hair"}

